# Personal Information
personal:
  name: Omega Makena Mwebia
  email: mwebiamakenaa@gmail.com
  location: Kenya
  bio: |
    <p class="intro font-medium text-lg mb-4 text-text-primary">I work at the intersection of <strong>quantitative modelling, machine learning, and complex systems</strong>.</p>
    
    <p class="mb-4">My professional work involves building quantitative and machine-learning models, primarily in F#, for problems where statistical structure, uncertainty, and changing data matter.</p>
    
    <p class="mb-4">Alongside this work, I conduct independent research into how structure can be discovered and used when data is limited, noisy, or continuously changing. This includes <a href="/projects/scarcity/"><strong>Scarcity</strong></a>, my ongoing research programme on relationship discovery and learning under data scarcity, as well as quantitative research into financial markets and systematic modelling.</p>
    
    <p class="mb-4">I am particularly interested in problems where the obvious solution is to use more data or a larger model, but where the more interesting question is whether the underlying <strong>structure of the system can be understood first</strong>.</p>
    
    <p class="mb-2 font-bold text-text-primary mt-6">My research interests include:</p>
    <ul class="list-disc list-inside mb-6 space-y-1 text-text-muted text-sm ml-2">
      <li>quantitative finance and market microstructure;</li>
      <li>financial and macroeconomic modelling;</li>
      <li>time-series and statistical machine learning;</li>
      <li>relationship and structure discovery;</li>
      <li>dynamic and evolving systems;</li>
      <li>causal and predictive modelling;</li>
      <li>learning under data and compute constraints.</li>
    </ul>

    <p class="mb-4">I build systems to investigate these questions, but I am more interested in <strong>what the experiments establish</strong> than in how large or sophisticated the system appears.</p>
  
